services:
  - type: web
    name: fittrack-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: fittrack-db
    databaseName: fittrack
    user: fittrack
    plan: free
